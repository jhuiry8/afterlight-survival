name: Deploy static game to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Configure multiplayer connection
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.AFTERLIGHT_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.AFTERLIGHT_SUPABASE_ANON_KEY }}
        run: |
          if [[ -n "$SUPABASE_URL" && -n "$SUPABASE_KEY" ]]; then
            printf 'window.AFTERLIGHT_CONFIG = { url: "%s", anonKey: "%s" };\n' "$SUPABASE_URL" "$SUPABASE_KEY" > config.js
          else
            cp config.example.js config.js
          fi
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
